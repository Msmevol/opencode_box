; Sandbox policy example

[target]
exe = C:\path\to\program.exe
args = --some-flag value

[resources]
memory_limit_mb = 256
cpu_rate_percent = 25
max_processes = 2

[policy]
process_creation = deny
inherit_env = true

[logging]
; level: debug / info / warn / error / off
level = info
; file: true = save sandbox.log in policy directory, false = no file
file = true

[allowed_dirs]
; path = writable / readonly
C:\Users\*\AppData\Local\Temp\** = writable
C:\Windows\System32\** = readonly

[domain_whitelist]
; one domain per line, supports wildcard: *.example.com
localhost
*.github.com
api.openai.com

[registry_rules]
; pattern = allow / deny / ask (first match wins)
HKCU\Software\** = allow
HKLM\** = deny
** = deny

[environment]
; key = value (set custom environment variables)
MY_APP_MODE = sandbox
LANG = en_US.UTF-8

[path_append]
; one path per line (appended to PATH)
C:\my_tools\bin
C:\another\path
