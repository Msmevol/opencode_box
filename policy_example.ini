; Sandbox policy example

[target]
exe = C:\path\to\program.exe
args = --some-flag value

[resources]
memory_limit_mb = 256
cpu_rate_percent = 25
max_processes = 2

[policy]
process_creation = deny
inherit_env = true

[allowed_dirs]
; path = writable / readonly
C:\Users\*\AppData\Local\Temp\** = writable
C:\Windows\System32\** = readonly

[domain_whitelist]
; one domain per line, supports wildcard: *.example.com
localhost
*.github.com
api.openai.com

[registry_rules]
; pattern = allow / deny / ask (first match wins)
HKCU\Software\** = allow
HKLM\** = deny
* = deny
